name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Cold `tsc` runs twice (server + admin-ui) plus a browser-backed test subset. The test
    # script caps each test at 120s (--test-timeout), so a single hang self-reports and fails
    # fast; this job cap is the outer backstop.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # search_in_project shells out to ripgrep; it is not part of the base runner image.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # A handful of tests (monitor_published_demo_health, test_form_persistence,
      # record_project_workspace_video) launch real headless Chromium, so the browser and its
      # OS libraries must be present. Chromium only — no test uses firefox/webkit at runtime.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test (typecheck + unit tests)
        run: npm test
