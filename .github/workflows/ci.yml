name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Cold `tsc` runs twice (server + admin-ui) plus a browser-backed test subset; cap the job
    # so a genuine hang fails fast instead of burning the 6-hour default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A handful of tests (monitor_published_demo_health, test_form_persistence,
      # record_project_workspace_video) launch real headless Chromium, so the browser and its
      # OS libraries must be present. Chromium only — no test uses firefox/webkit at runtime.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test (typecheck + unit tests)
        run: npm test
